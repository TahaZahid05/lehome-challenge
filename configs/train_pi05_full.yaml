dataset:
  repo_id: four_types_merged_with_depth
  root: Datasets/example/four_types_merged_with_depth
  image_transforms:
    enable: true
    max_num_transforms: 3
    tfs:
      brightness: {weight: 1.0, type: ColorJitter, kwargs: {brightness: [0.8, 1.2]}}
      contrast: {weight: 1.0, type: ColorJitter, kwargs: {contrast: [0.8, 1.2]}}
      saturation: {weight: 1.0, type: ColorJitter, kwargs: {saturation: [0.0, 1.5]}}
      hue: {weight: 1.0, type: ColorJitter, kwargs: {hue: [-0.05, 0.05]}}
      sharpness: {weight: 1.0, type: SharpnessJitter, kwargs: {sharpness: [0.5, 1.5]}}
      affine: {weight: 1.0, type: RandomAffine, kwargs: {degrees: [-5.0, 5.0], translate: [0.05, 0.05]}}

policy:
  type: pi05
  pretrained_path: lerobot/pi05_base
  device: cuda
  dtype: bfloat16
  push_to_hub: false
  use_amp: true
  compile_model: false
  num_inference_steps: 10

  # Memory optimization
  gradient_checkpointing: true

  # Input features
  input_features:
    observation.state:
      type: STATE
      shape: [12]
    observation.images.top_rgb:
      type: VISUAL
      shape: [3, 480, 640]
    observation.images.left_rgb:
      type: VISUAL
      shape: [3, 480, 640]
    observation.images.right_rgb:
      type: VISUAL
      shape: [3, 480, 640]

  output_features:
    action:
      type: ACTION
      shape: [12]

peft:
  method_type: LORA
  r: 16
  target_modules: ".*(q|k|v|o|gate|up|down)_proj"
  full_training_modules:
    - paligemma_with_expert.gemma_expert
    - action_in_proj
    - action_out_proj
    - time_mlp_in
    - time_mlp_out

output_dir: outputs/train/pi05_full
batch_size: 8
steps: 60000
save_freq: 1000
log_freq: 500

wandb:
  enable: true
  project: lehome_pi05
