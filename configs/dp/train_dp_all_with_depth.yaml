dataset:
  repo_id: repo_dp
  root: Datasets/example/four_types_merged_with_depth

policy:
  type: diffusion
  device: cuda
  push_to_hub: false

  # Avoid or increase the crop size, as the small default crop dimensions 
  # may restrict the field of view and lead to task failure.
  crop_shape: null
  crop_is_random: false
  
  input_features:
    observation.state:
      type: STATE
      shape: [12]
    observation.images.top_rgb:
      type: VISUAL
      shape: [3, 480, 640]
    observation.images.left_rgb:
      type: VISUAL
      shape: [3, 480, 640]
    observation.images.right_rgb:
      type: VISUAL
      shape: [3, 480, 640]
    observation.top_depth:
      type: STATE
      shape: [1, 480, 640]
  
  output_features:
    action:
      type: ACTION
      shape: [12]

output_dir: outputs/train/dp_all_with_depth
batch_size: 8
steps: 330000
save_freq: 33000
log_freq: 3300

wandb:
  enable: false